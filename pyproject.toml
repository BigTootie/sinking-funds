[project]
name = 'savings_funds'
version = '0.1.0'
description = ''
readme = 'README.md'
requires-python = '>=3.10'
authors = [
    { name = 'Brian Austin', email = 'brian.austin348@gmail.com' }
]
dependencies = [
    'flet>=1.0.4',
    'python-dateutil>=2.9.0.post0',
    'requests>=2.34.2'
]

[dependency-groups]
dev = [
    'flet-cli>=1.0.4',
    'flet-desktop>=1.0.4',
    'flet-web>=1.0.4',
    'flet[test]',
]

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
pythonpath = ['src']
markers = [
    'first_run: start the application without saved local configuration or balance',
    'seed_funds(funds): initialize the isolated test store with the supplied funds',
]

[tool.flet]
org = 'one.theaustins'
product = 'Savings Funds'
company = 'TBD LLC'
copyright = 'Copyright (C) 2026 TBD LLC'

[tool.flet.app]
path = 'src'
