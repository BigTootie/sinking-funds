[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'savings_funds'
version = '0.5.0'
description = 'Personal savings funds and monthly budget tracker built with Flet.'
readme = 'README.md'
requires-python = '>=3.10'
authors = [
    { name = 'Brian Austin', email = 'brian.austin348@gmail.com' }
]
dependencies = [
    'cryptography>=42.0.0',
    'flet>=1.0.4',
    'platformdirs>=4.12.4',
    'python-dateutil>=2.9.0.post0',
    'requests>=2.34.2',
]

[dependency-groups]
dev = [
    'flet-cli>=1.0.4',
    'flet-desktop>=1.0.4',
    'flet-web>=1.0.4',
    'flet[test]',
    'hypothesis>=6.168.5',
    'mypy>=2.4.1',
    'pytest-cov>=7.1.0',
    'ruff>=0.17.2',
]

[tool.setuptools]
package-dir = { '' = 'src' }
py-modules = [
    'app',
    'budget',
    'colors',
    'data',
    'fund',
    'ledger',
    'main',
    'nextcloud',
    'paths',
    'utils',
]

[tool.setuptools.packages.find]
where = ['src']
include = ['ui*', 'sync*']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
pythonpath = ['src']
addopts = [
    '--cov=src',
    '--cov-report=term-missing',
    '--cov-fail-under=70',
]
markers = [
    'first_run: start the application without saved local configuration or balance',
    'seed_funds(funds): initialize the isolated test store with the supplied funds',
]

[tool.ruff]
target-version = 'py310'

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I', 'UP', 'B', 'SIM']

[tool.ruff.format]
quote-style = 'single'

[tool.mypy]
python_version = '3.10'
mypy_path = 'src'
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.coverage.run]
source = ['src']

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.flet]
org = 'one.theaustins'
product = 'Savings Funds'
company = 'TBD LLC'
copyright = 'Copyright (C) 2026 TBD LLC'

[tool.flet.app]
path = 'src'
